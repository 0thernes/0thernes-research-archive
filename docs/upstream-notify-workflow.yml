# Drop-in workflow template for upstream public 0thernes/* repositories.
# Copy to `.github/workflows/notify-archive.yml` in any public research repo.
# Once a repository or account secret `ARCHIVE_SYNC_TOKEN` (fine-grained PAT with
# Contents: write on 0thernes/0thernes-research-archive) is configured, every push
# to `main` triggers an immediate live-mirror refresh on the master archive hub.
# If the secret is unset, this job exits 0 gracefully and the hub's 2-hour schedule
# still syncs upstream status automatically.
name: Notify Master Research Archive (Live Sync)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Dispatch upstream-repo-updated to 0thernes-research-archive
        env:
          TOKEN: ${{ secrets.ARCHIVE_SYNC_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "ARCHIVE_SYNC_TOKEN not set; skipping instant dispatch (hub cron syncs automatically)."
            exit 0
          fi
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/0thernes/0thernes-research-archive/dispatches \
            -d "{\"event_type\":\"upstream-repo-updated\",\"client_payload\":{\"repo\":\"${{ github.repository }}\",\"sha\":\"${{ github.sha }}\",\"ref\":\"${{ github.ref }}\"}}"
